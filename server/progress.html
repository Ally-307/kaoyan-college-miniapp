<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>985 专业采集进度</title>
<style>
:root {
  color-scheme: light dark;
  --background: #f6f7f9;
  --foreground: #17202a;
  --muted: #66707c;
  --track: #e2e6eb;
  --fill: #0f766e;
  --line: #d5dae1;
  --ok: #15803d;
  --warn: #b45309;
  --bad: #b91c1c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --background: #0e1116;
    --foreground: #f2f4f7;
    --muted: #9aa4b0;
    --track: #232a33;
    --fill: #2dd4bf;
    --line: #2b333d;
    --ok: #34d399;
    --warn: #fbbf24;
    --bad: #f87171;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--background);
  color: var(--foreground);
  font: 16px/1.5 system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
}
main {
  max-width: 760px;
  margin: 0 auto;
  padding: 28px 20px 40px;
}
header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
}
h1 {
  margin: 0;
  font-size: 20px;
  font-weight: 500;
}
h2 {
  margin: 0 0 10px;
  font-size: 14px;
  font-weight: 500;
  color: var(--muted);
}
.status {
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 4px 12px;
  font-size: 13px;
  color: var(--muted);
}
.status.running { color: var(--fill); border-color: var(--fill); }
.status.done { color: var(--ok); border-color: var(--ok); }
.status.stopped { color: var(--bad); border-color: var(--bad); }
.bar-wrap { margin-top: 28px; }
.bar {
  height: 22px;
  border-radius: 999px;
  background: var(--track);
  overflow: hidden;
}
.fill {
  height: 100%;
  width: 0%;
  background: var(--fill);
  border-radius: 999px;
  transition: width 0.6s ease;
}
.bar-meta {
  display: flex;
  justify-content: space-between;
  margin-top: 10px;
  font-size: 24px;
  font-weight: 500;
}
.bar-meta span:last-child {
  font-size: 14px;
  color: var(--muted);
  align-self: flex-end;
}
.stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin-top: 24px;
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
  padding: 18px 0;
}
.stats div { min-width: 0; }
.label {
  display: block;
  font-size: 13px;
  color: var(--muted);
}
.stats strong {
  display: block;
  margin-top: 4px;
  font-size: 22px;
  font-weight: 500;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.current {
  margin-top: 24px;
  border-bottom: 1px solid var(--line);
  padding-bottom: 18px;
}
.current strong {
  display: block;
  margin-top: 4px;
  font-size: 17px;
  font-weight: 500;
}
.issues { margin-top: 20px; }
.chip {
  display: inline-block;
  margin: 0 8px 8px 0;
  padding: 4px 10px;
  border-radius: 999px;
  font-size: 13px;
  border: 1px solid var(--line);
}
.chip.跳过 { color: var(--warn); border-color: var(--warn); }
.chip.失败 { color: var(--bad); border-color: var(--bad); }
footer {
  margin-top: 24px;
  font-size: 13px;
  color: var(--muted);
}
@media (max-width: 520px) {
  main { padding: 20px 14px 32px; }
  .stats { grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .stats strong { font-size: 18px; }
  .bar-meta { font-size: 20px; }
}
</style>
</head>
<body>
<main>
  <header>
    <h1>985 专业采集进度</h1>
    <span id="status" class="status">未启动</span>
  </header>
  <section class="bar-wrap" aria-label="采集进度">
    <div class="bar"><div id="fill" class="fill"></div></div>
    <div class="bar-meta">
      <span id="percent">0%</span>
      <span id="counts">0 / 0</span>
    </div>
  </section>
  <section class="stats" aria-label="统计">
    <div><span class="label">已采集学校</span><strong id="done">0</strong></div>
    <div><span class="label">真实专业</span><strong id="programs">0</strong></div>
    <div><span class="label">已用时间</span><strong id="elapsed">0:00</strong></div>
  </section>
  <section class="current" aria-label="当前学校">
    <span class="label">当前学校</span>
    <strong id="school">-</strong>
  </section>
  <section id="issues" class="issues" hidden></section>
  <footer id="updated">等待数据...</footer>
</main>
<script>
if (location.protocol === 'file:') {
  location.replace('http://127.0.0.1:8010/progress');
}
async function refresh() {
  try {
    const r = await fetch('/api/collect/progress', { cache: 'no-store' });
    const j = await r.json();
    const d = j.data || {};
    const pct = Math.min(100, Math.max(0, Math.round(d.percent || 0)));
    document.getElementById('fill').style.width = pct + '%';
    document.getElementById('percent').textContent = pct + '%';
    document.getElementById('counts').textContent = (d.processed || 0) + ' / ' + (d.total || 0);
    document.getElementById('done').textContent = d.done || 0;
    document.getElementById('programs').textContent = d.programs || 0;
    document.getElementById('elapsed').textContent = fmt(d.elapsedSec || 0);
    document.getElementById('school').textContent = d.school || '-';
    const st = document.getElementById('status');
    if (d.running) {
      st.textContent = '采集中';
      st.className = 'status running';
    } else if ((d.total || 0) > 0 && (d.done || 0) >= d.total) {
      st.textContent = '已完成';
      st.className = 'status done';
    } else if ((d.total || 0) > 0) {
      st.textContent = '已停止';
      st.className = 'status stopped';
    } else {
      st.textContent = '未启动';
      st.className = 'status';
    }
    const issues = [];
    (d.skipped || []).forEach(function (n) { issues.push({ n: n, t: '跳过' }); });
    (d.failed || []).forEach(function (n) { issues.push({ n: n, t: '失败' }); });
    const box = document.getElementById('issues');
    if (issues.length) {
      box.hidden = false;
      box.innerHTML = '<h2>需关注</h2>' + issues.map(function (x) {
        return '<span class="chip ' + x.t + '">' + x.n + ' · ' + x.t + '</span>';
      }).join('');
    } else {
      box.hidden = true;
    }
    document.getElementById('updated').textContent = '最后更新 ' + new Date().toLocaleTimeString('zh-CN', { hour12: false });
  } catch (e) {
    document.getElementById('updated').textContent = '连接失败，请确认本地服务已启动后刷新';
  }
}
function fmt(sec) {
  const h = Math.floor(sec / 3600);
  const m = Math.floor((sec % 3600) / 60);
  const s = sec % 60;
  const p = function (n) { return String(n).padStart(2, '0'); };
  return h ? h + ':' + p(m) + ':' + p(s) : p(m) + ':' + p(s);
}
refresh();
setInterval(refresh, 1500);
</script>
</body>
</html>
